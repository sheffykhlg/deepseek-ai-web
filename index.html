<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>NEXUS-2050 // QUANTUM CORE AI</title>
  <!-- Tesseract.js for Multi-Image OCR -->
  <script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@600;800;900&family=Rajdhani:wght@500;600;700&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
  
  <style>
    :root {
      --bg: #030712;
      --card-bg: rgba(15, 23, 42, 0.85);
      --cyan: #06b6d4;
      --neon-cyan: #22d3ee;
      --magenta: #d946ef;
      --border-glow: rgba(34, 211, 238, 0.35);
      --text: #f1f5f9;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
    
    html, body {
      height: 100%;
      height: 100dvh;
      width: 100%;
      overflow: hidden;
      background: var(--bg);
      color: var(--text);
      font-family: 'Rajdhani', sans-serif;
      display: flex;
      flex-direction: column;
      background-image: 
        radial-gradient(circle at 10% 15%, rgba(34, 211, 238, 0.1) 0%, transparent 35%),
        radial-gradient(circle at 90% 85%, rgba(217, 70, 239, 0.1) 0%, transparent 35%),
        linear-gradient(rgba(3, 7, 18, 0.95), rgba(3, 7, 18, 0.95));
    }

    /* Responsive Futuristic Header */
    header {
      background: rgba(10, 15, 30, 0.9);
      backdrop-filter: blur(12px);
      padding: 10px 16px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid var(--border-glow);
      box-shadow: 0 2px 20px rgba(6, 182, 212, 0.15);
      z-index: 10;
      flex-shrink: 0;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .brand-title {
      font-family: 'Orbitron', sans-serif;
      font-size: 1.05rem;
      font-weight: 900;
      letter-spacing: 1.5px;
      background: linear-gradient(135deg, #22d3ee 0%, #d946ef 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .status-badge {
      font-family: 'Orbitron', sans-serif;
      font-size: 0.6rem;
      color: #22d3ee;
      border: 1px solid rgba(34, 211, 238, 0.4);
      padding: 2px 6px;
      border-radius: 4px;
      background: rgba(34, 211, 238, 0.1);
      display: flex;
      align-items: center;
      gap: 5px;
    }

    .pulse-dot {
      width: 5px;
      height: 5px;
      background: #22d3ee;
      border-radius: 50%;
      box-shadow: 0 0 8px #22d3ee;
      animation: pulse 1.5s infinite;
    }
    @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.4; } }

    .header-actions button {
      background: rgba(15, 23, 42, 0.8);
      border: 1px solid rgba(239, 68, 68, 0.4);
      color: #f87171;
      font-family: 'Orbitron', sans-serif;
      font-size: 0.65rem;
      padding: 5px 10px;
      border-radius: 4px;
      cursor: pointer;
    }

    /* Main Chat Stream */
    #chat-box {
      flex: 1;
      overflow-y: auto;
      padding: 14px;
      display: flex;
      flex-direction: column;
      gap: 12px;
      -webkit-overflow-scrolling: touch;
    }

    .message {
      max-width: 88%;
      padding: 10px 14px;
      border-radius: 8px;
      font-size: 0.98rem;
      line-height: 1.5;
      word-break: break-word;
      white-space: pre-wrap;
    }

    .user-msg {
      background: linear-gradient(135deg, rgba(6, 182, 212, 0.25) 0%, rgba(59, 130, 246, 0.3) 100%);
      color: #ffffff;
      align-self: flex-end;
      border: 1px solid rgba(34, 211, 238, 0.4);
      border-top-right-radius: 0;
    }

    .ai-msg {
      background: rgba(15, 23, 42, 0.9);
      color: #e2e8f0;
      align-self: flex-start;
      border: 1px solid rgba(168, 85, 247, 0.35);
      border-top-left-radius: 0;
    }

    .image-grid {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-top: 6px;
    }
    .thumb-img {
      max-width: 140px;
      max-height: 110px;
      border-radius: 6px;
      border: 1px solid var(--neon-cyan);
      object-fit: cover;
    }

    pre {
      background: #020617;
      border: 1px solid rgba(34, 211, 238, 0.25);
      padding: 10px;
      border-radius: 6px;
      overflow-x: auto;
      margin: 8px 0;
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.85rem;
      color: #38bdf8;
      white-space: pre;
    }
    code { font-family: 'JetBrains Mono', monospace; color: var(--neon-cyan); }

    /* Drag & Drop Visual Overlay */
    #drop-overlay {
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(3, 7, 18, 0.92);
      border: 2px dashed var(--neon-cyan);
      backdrop-filter: blur(8px);
      z-index: 100;
      display: none;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 12px;
      pointer-events: none;
      padding: 20px;
      text-align: center;
    }
    #drop-overlay.active { display: flex; }
    .drop-text {
      font-family: 'Orbitron', sans-serif;
      font-size: 1.3rem;
      font-weight: 700;
      color: var(--neon-cyan);
      letter-spacing: 1px;
    }

    /* Mobile-Optimized Footer Console */
    footer {
      background: rgba(10, 15, 30, 0.95);
      backdrop-filter: blur(12px);
      padding: 10px 14px;
      border-top: 1px solid var(--border-glow);
      flex-shrink: 0;
    }

    .input-wrapper {
      max-width: 900px;
      margin: 0 auto;
      display: flex;
      gap: 8px;
      align-items: center;
    }

    .upload-trigger {
      background: rgba(15, 23, 42, 0.9);
      border: 1px solid var(--neon-cyan);
      color: var(--neon-cyan);
      font-family: 'Orbitron', sans-serif;
      font-size: 0.78rem;
      padding: 11px 12px;
      border-radius: 6px;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 4px;
      white-space: nowrap;
      flex-shrink: 0;
    }
    input[type="file"] { display: none; }

    .cyber-input {
      flex: 1;
      background: rgba(15, 23, 42, 0.85);
      border: 1px solid rgba(148, 163, 184, 0.25);
      border-radius: 6px;
      padding: 11px 14px;
      color: #fff;
      font-family: 'Rajdhani', sans-serif;
      font-size: 1rem;
      outline: none;
      min-width: 0;
    }
    .cyber-input:focus {
      border-color: var(--neon-cyan);
    }

    .send-trigger {
      background: linear-gradient(135deg, #06b6d4 0%, #a855f7 100%);
      color: #fff;
      border: none;
      font-family: 'Orbitron', sans-serif;
      font-weight: 700;
      font-size: 0.8rem;
      padding: 11px 16px;
      border-radius: 6px;
      cursor: pointer;
      flex-shrink: 0;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .send-trigger:disabled { background: #334155; }

    .cyber-spinner {
      width: 14px;
      height: 14px;
      border: 2px solid rgba(255, 255, 255, 0.3);
      border-top-color: #22d3ee;
      border-radius: 50%;
      animation: spin 0.7s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* Media queries for small mobile screens */
    @media (max-width: 480px) {
      .message { max-width: 92%; font-size: 0.92rem; }
      .upload-trigger { padding: 11px 10px; font-size: 0.75rem; }
      .send-trigger { padding: 11px 14px; font-size: 0.75rem; }
      .brand-title { font-size: 0.95rem; }
      .thumb-img { max-width: 110px; max-height: 90px; }
    }
  </style>
</head>
<body id="drop-zone">

  <!-- Drag & Drop Fullscreen Overlay -->
  <div id="drop-overlay">
    <div style="font-size: 2.5rem;">📥</div>
    <div class="drop-text">DROP IMAGES FOR OCR</div>
    <div style="color: #94a3b8; font-size: 0.9rem;">Drop photos to extract optical text data</div>
  </div>

  <header>
    <div class="brand">
      <span class="brand-title">NEXUS 2050</span>
      <div class="status-badge">
        <div class="pulse-dot"></div>
        <span>Ready</span>
      </div>
    </div>
    <div class="header-actions">
      <button onclick="clearChat()">CLEAR</button>
    </div>
  </header>

  <div id="chat-box">
    <div class="message ai-msg">Online. Send any message or tap <b>[+ OCR]</b> to scan images.</div>
  </div>

  <footer>
    <div class="input-wrapper">
      <label class="upload-trigger" title="Upload images for OCR">
        <span>📷 + OCR</span>
        <input type="file" id="image-upload" accept="image/*" multiple onchange="handleMultipleFiles(this.files)" />
      </label>
      <input type="text" id="user-input" class="cyber-input" placeholder="Type a message..." autocomplete="off" autofocus />
      <button class="send-trigger" id="send-btn" onclick="sendMessage()">SEND</button>
    </div>
  </footer>

  <script>
    const API_ENDPOINT = "https://sheffysamra1bot-deepseek-api.smpost-tempmail.workers.dev/";
    const chatBox = document.getElementById("chat-box");
    const userInput = document.getElementById("user-input");
    const sendBtn = document.getElementById("send-btn");
    const dropOverlay = document.getElementById("drop-overlay");

    // Drag and Drop
    window.addEventListener("dragenter", (e) => { e.preventDefault(); dropOverlay.classList.add("active"); });
    window.addEventListener("dragover", (e) => { e.preventDefault(); });
    window.addEventListener("dragleave", (e) => { if (e.relatedTarget === null || e.clientX === 0) dropOverlay.classList.remove("active"); });
    window.addEventListener("drop", (e) => {
      e.preventDefault();
      dropOverlay.classList.remove("active");
      const files = e.dataTransfer.files;
      if (files && files.length > 0) handleMultipleFiles(files);
    });

    userInput.addEventListener("keydown", (e) => {
      if (e.key === "Enter" && !e.shiftKey) {
        e.preventDefault();
        sendMessage();
      }
    });

    // Pure Raw Transmission: Exactly what API returns is displayed
    async function sendMessage() {
      const text = userInput.value.trim();
      if (!text) return;

      appendRawMessage(text, "user-msg");
      userInput.value = "";
      userInput.focus();

      sendBtn.disabled = true;
      sendBtn.innerHTML = '<div class="cyber-spinner"></div>';
      
      const loadingMsg = appendRawMessage("...", "ai-msg");

      try {
        const response = await fetch(`${API_ENDPOINT}?prompt=${encodeURIComponent(text)}`);
        const data = await response.json();
        chatBox.removeChild(loadingMsg);

        if (data.response) {
          appendRawMessage(data.response, "ai-msg");
        } else {
          appendRawMessage("Error: Could not retrieve response.", "ai-msg");
        }
      } catch (err) {
        if (loadingMsg && loadingMsg.parentNode) chatBox.removeChild(loadingMsg);
        appendRawMessage("Network Error: Could not connect to API.", "ai-msg");
      } finally {
        sendBtn.disabled = false;
        sendBtn.innerHTML = "SEND";
      }
    }

    // Multi-Image OCR
    async function handleMultipleFiles(fileList) {
      const imageFiles = Array.from(fileList).filter(f => f.type.startsWith("image/"));
      if (imageFiles.length === 0) return;

      const userPost = document.createElement("div");
      userPost.className = "message user-msg";
      userPost.innerHTML = `<b>Uploaded ${imageFiles.length} Image(s):</b>`;

      const grid = document.createElement("div");
      grid.className = "image-grid";

      imageFiles.forEach(file => {
        const img = document.createElement("img");
        img.className = "thumb-img";
        img.src = URL.createObjectURL(file);
        grid.appendChild(img);
      });
      userPost.appendChild(grid);
      chatBox.appendChild(userPost);
      chatBox.scrollTop = chatBox.scrollHeight;

      for (let i = 0; i < imageFiles.length; i++) {
        const file = imageFiles[i];
        const statusDiv = appendRawMessage(`Scanning [${i + 1}/${imageFiles.length}] ${file.name}...`, "ai-msg");

        try {
          const result = await Tesseract.recognize(file, 'eng', {
            logger: m => {
              if (m.status === 'recognizing text') {
                statusDiv.innerText = `Scanning [${i + 1}/${imageFiles.length}] ${Math.round(m.progress * 100)}%`;
              }
            }
          });

          chatBox.removeChild(statusDiv);
          const text = result.data.text.trim();

          if (text) {
            appendRawMessage(`[OCR: ${file.name}]\n\n${text}`, "ai-msg");
          } else {
            appendRawMessage(`[OCR: ${file.name}]\nNo text found.`, "ai-msg");
          }
        } catch (err) {
          chatBox.removeChild(statusDiv);
          appendRawMessage(`Failed to read: ${file.name}`, "ai-msg");
        }
      }
    }

    function appendRawMessage(text, className) {
      const div = document.createElement("div");
      div.className = `message ${className}`;
      div.innerText = text;
      chatBox.appendChild(div);
      chatBox.scrollTop = chatBox.scrollHeight;
      return div;
    }

    function clearChat() {
      chatBox.innerHTML = '<div class="message ai-msg">Online. Send any message or tap <b>[+ OCR]</b> to scan images.</div>';
    }
  </script>
</body>
</html>
